# Recerca automàtica a FamilySearch: baixa el pedigrí amb el teu compte,
# refà els informes que en depenen i escriu noves propostes a
# reports/candidates-<data>.yaml.
#
# No toca el GEDCOM ni `main` directament -- res no ho fa mai sol, ni aquest
# workflow -- i s'obre com a PR perquè les propostes esperen la teva decisió
# (accept: true/false/null) igual que si les haguessis generat en local.
#
# Què li fa falta: FAMILY_SEARCH_USERNAME i FAMILY_SEARCH_PASSWORD com a
# repository secrets (Settings > Secrets and variables > Actions), i
# `familysearch: arrel:` al config.yaml. Si encara no hi és tot, la feina
# «configuracio» d'avall ho diu i atura la resta abans de gastar cap petició:
# calla si és el cron d'un repositori que ningú no ha acabat de configurar, i
# falla si el que hi ha és una configuració a mitges.
#
# L'arrel de qui baixar l'ascendència ve del `config.yaml` («familysearch:
# arrel:»); el camp «root» de sota només fa falta per fer una prova puntual
# amb una altra persona.

name: Recerca FamilySearch

on:
  schedule:
    - cron: '0 6 * * *' # cada dia 06:00 UTC
  workflow_dispatch:
    inputs:
      root:
        description: "Xref arrel de FamilySearch (buit = el del config.yaml)"
        default: ''
      top:
        description: "Quants fronts de recerca (tools.research --top)"
        default: '5'
      targets:
        description: "Xrefs concrets a investigar, separats per comes (substitueix --top)"
        default: ''
      depth:
        description: "Generacions per amunt dels pares a proposar (tools.research --depth)"
        default: '2'
      comprovar:
        description: "Quantes persones comprovar a FamilySearch (0 = totes les pendents)"
        default: '0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recerca-familysearch
  cancel-in-progress: false

jobs:
  # Abans de res, mirar si aquest repositori té la recerca muntada.
  #
  # La plantilla -- i qualsevol còpia acabada de fer-ne -- du el cron posat
  # però encara no du ni `familysearch: arrel:` al config.yaml ni els secrets
  # de FamilySearch, i això era una feina fallida cada matí: les cinc
  # execucions programades de genealogia-plantilla, del 17 al 31 d'agost de
  # 2026, van fallar totes al mateix `tools.fs.session --whoami`, amb «no
  # credentials». Res no s'havia espatllat: ningú no ho havia configurat
  # encara. I un correu diari que sempre diu el mateix acaba per no llegir-se
  # justament el dia que en diu una altra.
  #
  # La distinció que fa la diferència, i per què això no és «si no hi ha
  # secrets, calla»:
  #
  #   * `arrel` en blanc = la recerca no està muntada en aquest repositori.
  #     El cron calla i la feina de sota es marca com a saltada. El botó
  #     (`workflow_dispatch`) no calla: qui l'ha premut ho ha fet a posta i
  #     mereix saber què li falta.
  #   * `arrel` posada i secrets no = configuració a mitges, i això sí que és
  #     una avaria. Falla sempre, també des del cron, com fins ara.
  configuracio:
    runs-on: ubuntu-latest
    outputs:
      muntada: ${{ steps.mira.outputs.muntada }}
    env:
      FAMILY_SEARCH_USERNAME: ${{ secrets.FAMILY_SEARCH_USERNAME }}
      FAMILY_SEARCH_PASSWORD: ${{ secrets.FAMILY_SEARCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Mirar si hi ha arrel i credencials
        id: mira
        run: |
          set -euo pipefail

          usuari="${FAMILY_SEARCH_USERNAME:-}"
          clau="${FAMILY_SEARCH_PASSWORD:-}"

          # PyYAML i prou: llegir `familysearch: arrel:` amb grep se sembla a
          # funcionar fins que algú comenta la línia o li posa cometes.
          pip install --quiet --disable-pip-version-check 'PyYAML>=6.0'
          arrel="$(python - <<'PY'
          import pathlib

          import yaml

          dades = yaml.safe_load(pathlib.Path("config.yaml").read_text(encoding="utf-8")) or {}
          print(str((dades.get("familysearch") or {}).get("arrel") or "").strip())
          PY
          )"

          if [ -n "$arrel" ] && [ -n "$usuari" ] && [ -n "$clau" ]; then
            echo "muntada=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "muntada=false" >> "$GITHUB_OUTPUT"

          {
            if [ -z "$arrel" ]; then
              echo "## La recerca de FamilySearch encara no està configurada"
            else
              echo "## La recerca de FamilySearch està configurada a mitges"
            fi
            echo
            echo "Hi falta:"
            echo
            if [ -z "$arrel" ]; then
              echo "- \`familysearch: arrel:\` al \`config.yaml\`, amb el PID (forma \`XXXX-XXX\`) de la persona per qui vols arrencar l'arbre."
            fi
            if [ -z "$usuari" ]; then
              echo "- el secret \`FAMILY_SEARCH_USERNAME\` (Settings > Secrets and variables > Actions)."
            fi
            if [ -z "$clau" ]; then
              echo "- el secret \`FAMILY_SEARCH_PASSWORD\`, al mateix lloc."
            fi
            echo
            if [ -z "$arrel" ]; then
              echo "Mentre l'arrel no hi siga, la recerca programada no fa res, i això no és cap avaria."
            else
              echo "L'arrel hi és i els secrets no, o siga que això sí que és una avaria: per això aquesta feina falla."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$arrel" ]; then
            echo "::error::hi ha «familysearch: arrel:» al config.yaml però falten els secrets FAMILY_SEARCH_*: la recerca està configurada a mitges"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "::error::la recerca no està configurada en aquest repositori; el resum de la feina diu què hi falta"
            exit 1
          fi
          echo "::notice::la recerca no està configurada en aquest repositori: el cron no fa res"

  recerca:
    needs: configuracio
    if: needs.configuracio.outputs.muntada == 'true'
    runs-on: ubuntu-latest
    env:
      FAMILY_SEARCH_USERNAME: ${{ secrets.FAMILY_SEARCH_USERNAME }}
      FAMILY_SEARCH_PASSWORD: ${{ secrets.FAMILY_SEARCH_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Comprovar la sessió
        run: python -m tools.fs.session --whoami

      - name: Baixar el pedigrí
        # Els valors que escriu qui llança el workflow van per `env:` i no
        # interpolats dins del `run:`. Un `${{ inputs.x }}` s'expandeix com a
        # TEXT abans que bash llegisca res, o siga que un valor com
        # `x"; curl … | sh; #` deixa de ser un argument i passa a ser una ordre
        # més, en una feina que té `contents: write`, `pull-requests: write` i
        # els secrets de FamilySearch a l'entorn. Per `env:` arriba com a dada.
        env:
          ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          if [ -n "$ROOT" ]; then
            python -m tools.fs.fetch --root "$ROOT"
          else
            python -m tools.fs.fetch
          fi

      - name: Comprovar els fronts que el pedigrí no respon
        # `tools.fs.fetch` només sap contestar per qui queda damunt de l'arrel.
        # La resta de fronts enllaçats amb FamilySearch -- una branca
        # col·lateral, un enllaç fet a mà, els que la cadena va deixar a la
        # vuitena generació -- surten del pedigrí sense cap pare, i això no vol
        # dir que allà no en sàpiguen: vol dir que ningú no ho ha preguntat.
        # `frontier.md` els compta a «Sense comprovar» precisament per això.
        #
        # Ací es pregunta, i es pregunta ABANS d'escriure els informes, que és
        # l'únic ordre que serveix de res: els passos d'avall llegeixen el
        # mateix `cache/pedigree.json` que aquest enriqueix, o siga que cada
        # persona que FamilySearch sí que en sap els pares hi arriba ja com a
        # «A punt d'importar» en lloc de quedar-se sense comprovar. Les que
        # no, hi arriben com a «Encallades», que també és una resposta.
        #
        # Una consulta per persona, en l'ordre que `frontier.md` les classifica,
        # de manera que si el límit de peticions arriba abans que la cua
        # s'acabi, s'ha gastat en les que més valien.
        #
        # Per `env:`, mai interpolat dins del `run:`, igual que els altres.
        env:
          COMPROVAR: ${{ inputs.comprovar }}
        run: |
          set -euo pipefail
          python -m tools.fs.check --limit "${COMPROVAR:-0}"

      - name: Refer els informes que en depenen
        run: |
          set -euo pipefail
          python -m tools.match --live
          python -m tools.frontier
          python -m tools.worklist

      - name: Generar propostes noves
        # Igual que a «Baixar el pedigrí»: per `env:`, mai interpolats al `run:`.
        env:
          TARGETS: ${{ inputs.targets }}
          DEPTH: ${{ inputs.depth }}
          TOP: ${{ inputs.top }}
        run: |
          set -euo pipefail
          depth="${DEPTH:-2}"
          if [ -n "${TARGETS:-}" ]; then
            IFS=',' read -ra xrefs <<< "$TARGETS"
            for xref in "${xrefs[@]}"; do
              python -m tools.research --target "${xref// /}" --depth "$depth"
            done
          else
            python -m tools.research --top "${TOP:-5}" --depth "$depth"
          fi

      - name: Tornar a escriure els informes sense credencials
        # Els dos passos d'amunt generen frontier.md/worklist.md amb
        # cache/pedigree.json present -- l'únic entorn que hi té accés és
        # aquest, amb els secrets de FAMILY_SEARCH_*. `tools.lint --informes`
        # a Comprovacions no els té mai, o siga que sempre recalcularia un
        # text de procedència diferent («instantània de frontier-fs.json» en
        # lloc de «pedigrí fresc») i qualsevol PR d'aquest workflow fallaria
        # la comprovació sense que hi hagués cap dada real en desacord.
        #
        # El pas d'amunt ja ha deixat reports/frontier-fs.json fresc (el
        # pedigrí en viu s'hi escriu quan es genera frontier.md amb ell
        # present), o siga que amagar cache/pedigree.json i tornar a generar
        # dona la mateixa classificació però amb el text que Comprovacions sí
        # que pot reproduir arreu.
        run: |
          set -euo pipefail
          mv cache/pedigree.json cache/pedigree.json.viu
          python -m tools.frontier
          python -m tools.worklist

      - name: Obrir una PR si hi ha res de nou
        run: |
          set -euo pipefail

          if git diff --quiet -- reports/; then
            echo "Res de nou: cap informe ni proposta ha canviat." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          data="$(date +%Y-%m-%d)"
          branch="fs-recerca-${data}-${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add reports/
          git commit -m "Recerca automàtica de FamilySearch, ${data}"
          git push origin "$branch"

          {
            echo "## Propostes noves"
            echo
            echo '```'
            git diff --stat HEAD^ -- reports/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          gh pr create \
            --title "Recerca FamilySearch, ${data}" \
            --body "Informes refets i propostes noves a \`reports/candidates-${data}.yaml\`. Revisa-les amb \`reports/frontier.md\` al costat abans de decidir \`accept\`." \
            --head "$branch" \
            --base main
